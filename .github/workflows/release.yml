name: Release

# Publishes to nuget.org through Trusted Publishing: a policy on nuget.org trusts this repository's release.yml in the
# `nuget` environment, NuGet/login exchanges the job's OIDC token for a short-lived API key, and no long-lived key is
# stored anywhere. NUGET_USER is the nuget.org account (profile name, not email) that owns the package.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Tag matches the version in Directory.Build.props
        run: |
          version="$(dotnet msbuild src/FakeEmailPro/FakeEmailPro.csproj -getProperty:Version)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Version ${version} in Directory.Build.props (expected v${version})"
            exit 1
          fi

      - run: dotnet format FakeEmailPro.sln --verify-no-changes
      - run: dotnet test FakeEmailPro.sln -c Release
      - run: dotnet test FakeEmailPro.sln -c Release -p:TestTargetFramework=net10.0
      - name: Pack
        run: dotnet pack src/FakeEmailPro/FakeEmailPro.csproj -c Release -o artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The nuget.org trusted publishing policy is bound to this environment.
    environment:
      name: nuget
      url: https://www.nuget.org/packages/FakeEmailPro
    permissions:
      id-token: write # Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: artifacts/

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Log in to nuget.org (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # The .snupkg next to the .nupkg is pushed with it (symbols for Source Link debugging).
      - name: Push
        run: >-
          dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: artifacts/
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The release notes are this version's section of CHANGELOG.md.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## / { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md." > notes.md; fi
          gh release create "$GITHUB_REF_NAME" artifacts/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
