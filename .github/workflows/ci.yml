name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: .NET ${{ matrix.dotnet }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package targets net8.0; the suite runs on every supported runtime line.
        include:
          - dotnet: "8.0"
            tfm: net8.0
          - dotnet: "10.0"
            tfm: net10.0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet }}.x

      - run: dotnet restore -p:TestTargetFramework=${{ matrix.tfm }}

      - name: Format (dotnet format)
        if: matrix.dotnet == '8.0'
        run: dotnet format FakeEmailPro.sln --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build FakeEmailPro.sln -c Release --no-restore -p:TestTargetFramework=${{ matrix.tfm }}

      - name: Test
        run: dotnet test FakeEmailPro.sln -c Release --no-build -p:TestTargetFramework=${{ matrix.tfm }}

      - name: Pack
        if: matrix.dotnet == '8.0'
        run: dotnet pack src/FakeEmailPro/FakeEmailPro.csproj -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v7
        if: matrix.dotnet == '8.0'
        with:
          name: nupkg
          path: artifacts/
          if-no-files-found: error
